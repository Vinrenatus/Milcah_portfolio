<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="description" content="Milcah Mwangi - Senior Software Engineer specialising in fintech backend systems and AI model evaluation, with 20 years across UK banking and 4+ years of LLM training and evaluation" />
    <link rel="icon" href="/favicon.ico" />
    <title>Milcah Mwangi - Senior Software Engineer | Fintech Systems &amp; AI Model Evaluation</title>
  </head>
  <body>
    <!-- Resolve the theme before first paint so there is no light-to-dark flash.
         Runs ahead of the bundle; ThemeContext then reads the class back. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved || (prefersDark ? 'dark' : 'light');
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
